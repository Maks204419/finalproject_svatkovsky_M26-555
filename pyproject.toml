[project]
name = "valutatrade-hub"
version = "1.0.0"
description = "ValutaTrade Hub: virtual currency portfolio and rate parser"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["prettytable>=3.10,<4", "requests>=2.31,<3"]

[project.scripts]
valutatrade = "valutatrade_hub.cli.interface:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["valutatrade_hub"]

[tool.valutatrade]
data_dir = "data"
rates_ttl_seconds = 300
base_currency = "USD"
log_dir = "logs"
log_format = "text"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
